<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sweet 28, my angel.</title>

<style>

*{
font-family:
'Helvetica Neue',
Arial,
sans-serif;
box-sizing:border-box;
}

body{

margin:0;

background:

linear-gradient(
135deg,
#F7CAC9 0%,
#EFDDE8 45%,
#91A8D0 100%
);

display:flex;
justify-content:center;
align-items:center;

min-height:100vh;

}

.card{

width:850px;
max-width:90%;

padding:60px;

background:

rgba(
255,
255,
255,
0.72
);

backdrop-filter:

blur(15px);

border-radius:40px;

box-shadow:

0 15px 45px
rgba(
145,
168,
208,
0.25
);

text-align:center;

}

h1{

font-size:54px;

font-weight:500;

color:#6F83A8;

letter-spacing:1px;

margin-bottom:45px;

}

button{

border:none;

padding:
16px 38px;

border-radius:40px;

cursor:pointer;

font-size:18px;

background:

linear-gradient(
135deg,
#F7CAC9,
#91A8D0
);

color:white;

transition:.25s;

box-shadow:

0 8px 22px
rgba(
145,
168,
208,
0.25
);

}

button:hover{

transform:
translateY(-2px);

}

.hidden{

display:none;

}

.cake{

position:relative;

width:340px;
height:280px;

margin:auto;

}

.layer-bottom{

position:absolute;

bottom:0;

left:45px;

width:250px;
height:95px;

background:

#FFF8FA;

border:

4px solid
#DCCEE7;

border-radius:

0 0 28px 28px;

}

.layer-top{

position:absolute;

bottom:82px;

left:70px;

width:200px;
height:70px;

background:

#FFFFFF;

border:

4px solid
#C5D4EC;

border-radius:18px;

}

.cream{

position:absolute;

bottom:145px;

left:75px;

width:190px;
height:42px;

background:

linear-gradient(
90deg,
#F7CAC9,
#91A8D0
);

border-radius:50%;

}

.drip{

position:absolute;

background:

#F7CAC9;

width:16px;

border-radius:

0 0 15px 15px;

}

.d1{

left:105px;

bottom:118px;

height:30px;

}

.d2{

left:160px;

bottom:105px;

height:48px;

}

.d3{

left:215px;

bottom:120px;

height:32px;

}

.candle{

position:absolute;

bottom:155px;

width:14px;
height:70px;

border-radius:6px;

}

.c1{

left:120px;

background:#F7CAC9;

}

.c2{

left:160px;

background:#91A8D0;

}

.c3{

left:200px;

background:#D8BFE7;

}

.flame{

position:absolute;

top:-28px;

left:-2px;

width:18px;
height:28px;

background:

radial-gradient(
circle,
#FFFDEA 15%,
#FFD56B 50%,
#FF9D52 80%
);

border-radius:50%;

animation:

fire .25s
infinite alternate;

}

.off .flame{

display:none;

}

@keyframes fire{

from{

transform:
scale(1);

}

to{

transform:
scale(1.12)
rotate(-3deg);

}

}

#etat{

margin-top:25px;

color:#6F83A8;

font-size:18px;

}

iframe{

display:none;

}

</style>

</head>

<body>

<div class="card">

<div id="depart">

<h1>

Sweet 28, my angel.

</h1>

<button
onclick="commencer()">

for you

</button>

</div>

<div
id="anniv"
class="hidden">

<h1>

Sweet 28, my angel.

</h1>

<div
class="cake"
id="cake">

<div class="candle c1">

<div class="flame"></div>

</div>

<div class="candle c2">

<div class="flame"></div>

</div>

<div class="candle c3">

<div class="flame"></div>

</div>

<div class="cream"></div>

<div class="drip d1"></div>

<div class="drip d2"></div>

<div class="drip d3"></div>

<div class="layer-top"></div>

<div class="layer-bottom"></div>

</div>

<p id="etat">

allow microphone

</p>

<button
onclick="rallumer()">

light candles

</button>

</div>

<iframe
id="youtube"
allow="autoplay">
</iframe>

</div>

<script>

function commencer(){

document
.getElementById(
"depart"
)
.classList
.add(
"hidden"
)

document
.getElementById(
"anniv"
)
.classList
.remove(
"hidden"
)

document
.getElementById(
"youtube"
)
.src=

"https://www.youtube.com/embed/GZ5cOiqr5xA?autoplay=1"

micro()

}

function rallumer(){

document
.getElementById(
"cake"
)
.classList
.remove(
"off"
)

document
.getElementById(
"etat"
)
.innerHTML=

"blow"

}

async function micro(){

try{

const stream=

await navigator
.mediaDevices
.getUserMedia({

audio:true

})

document
.getElementById(
"etat"
)
.innerHTML=

"blow"

const context=

new AudioContext()

const source=

context
.createMediaStreamSource(
stream
)

const analyser=

context
.createAnalyser()

source
.connect(
analyser
)

const data=

new Uint8Array(
analyser.frequencyBinCount
)

function detect(){

analyser
.getByteFrequencyData(
data
)

let volume=

data.reduce(
(a,b)=>a+b
)
/data.length

if(volume>40){

document
.getElementById(
"cake"
)
.classList
.add(
"off"
)

document
.getElementById(
"etat"
)
.innerHTML=

"candles out"

}

requestAnimationFrame(
detect
)

}

detect()

}

catch{

document
.getElementById(
"etat"
)
.innerHTML=

"microphone blocked"

}

}

</script>

</body>

</html>
