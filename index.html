<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Happy Birthday</title>

<style>

body{
margin:0;
background:#f5dce6;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{

background:white;
width:850px;
max-width:90%;
padding:50px;
border-radius:35px;
text-align:center;

box-shadow:0 10px 30px rgba(0,0,0,0.08);

}

h1{

font-size:60px;
color:#ff4e97;

}

button{

border:none;
padding:16px 35px;
border-radius:40px;
background:#ff5aa5;

color:white;
font-size:20px;

cursor:pointer;
margin:10px;

}

.hidden{

display:none;

}

.cake{

position:relative;

width:320px;
height:280px;

margin:auto;

}

.layer1{

position:absolute;

bottom:0;

left:35px;

width:250px;
height:90px;

background:#ffe6ef;

border-radius:0 0 25px 25px;

border:5px solid #ffbdd9;

}

.layer2{

position:absolute;

bottom:80px;

left:55px;

width:210px;
height:70px;

background:#fff4f8;

border-radius:15px;

border:5px solid #ffbdd9;

}

.top{

position:absolute;

bottom:140px;

left:75px;

width:170px;
height:45px;

background:#ff9cc6;

border-radius:50%;

}

.drip{

position:absolute;

background:#ff9cc6;

width:16px;
border-radius:0 0 15px 15px;

}

.d1{

left:95px;
height:30px;
bottom:120px;

}

.d2{

left:145px;
height:45px;
bottom:110px;

}

.d3{

left:205px;
height:35px;
bottom:118px;

}

.candle{

position:absolute;

width:14px;
height:70px;

bottom:150px;

border-radius:6px;

}

.c1{

left:105px;
background:#ff72a9;

}

.c2{

left:153px;
background:#ffd34d;

}

.c3{

left:201px;
background:#8ad9ff;

}

.flame{

position:absolute;

top:-28px;
left:-2px;

width:18px;
height:28px;

background:

radial-gradient(
circle,
#fff 15%,
#ffd44d 45%,
#ff8a00 75%
);

border-radius:

50% 50%
50% 50%;

animation:

fire .25s
infinite alternate;

}

.off .flame{

display:none;

}

@keyframes fire{

from{

transform:

scale(1)

}

to{

transform:

scale(1.15)

rotate(-3deg)

}

}

#etat{

font-size:20px;
color:#ff4e97;

margin-top:15px;

}

iframe{

display:none;

}

</style>

</head>

<body>

<div class="card">

<div id="depart">

<h1>

Happy Birthday

</h1>

<button onclick="commencer()">

Clique ici

</button>

</div>

<div
id="anniv"
class="hidden">

<h1>

Happy Birthday

</h1>

<div
id="cake"
class="cake">

<div class="candle c1">

<div class="flame"></div>

</div>

<div class="candle c2">

<div class="flame"></div>

</div>

<div class="candle c3">

<div class="flame"></div>

</div>

<div class="top"></div>

<div class="drip d1"></div>

<div class="drip d2"></div>

<div class="drip d3"></div>

<div class="layer2"></div>

<div class="layer1"></div>

</div>

<p id="etat">

Autorise le micro

</p>

<button
onclick="rallumer()">

Rallumer les bougies

</button>

</div>

<iframe
id="youtube"
allow="autoplay">
</iframe>

</div>

<script>

let stream

function commencer(){

document
.getElementById(
"depart"
)
.classList
.add("hidden")

document
.getElementById(
"anniv"
)
.classList
.remove("hidden")

document
.getElementById(
"youtube"
)
.src=

"https://www.youtube.com/embed/GZ5cOiqr5xA?autoplay=1"

micro()

}

function rallumer(){

document
.getElementById(
"cake"
)
.classList
.remove("off")

document
.getElementById(
"etat"
)
.innerHTML=

"Souffle"

}

async function micro(){

try{

stream=

await navigator
.mediaDevices
.getUserMedia({
audio:true
})

document
.getElementById(
"etat"
)
.innerHTML=

"Souffle"

const context=

new AudioContext()

const source=

context
.createMediaStreamSource(
stream
)

const analyser=

context
.createAnalyser()

source
.connect(
analyser
)

const data=

new Uint8Array(
analyser.frequencyBinCount
)

function detect(){

analyser
.getByteFrequencyData(
data
)

let volume=

data.reduce(
(a,b)=>a+b
)
/data.length

if(volume>42){

document
.getElementById(
"cake"
)
.classList
.add("off")

document
.getElementById(
"etat"
)
.innerHTML=

"Bougies éteintes"

}

requestAnimationFrame(
detect
)

}

detect()

}

catch{

document
.getElementById(
"etat"
)
.innerHTML=

"Micro refusé"

}

}

</script>

</body>
</html>
