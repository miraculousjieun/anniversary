<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Happy Birthday</title>

<style>

body{

margin:0;

background:

linear-gradient(
135deg,
#F7CAC9 0%,
#EDD9E5 45%,
#91A8D0 100%
);

font-family:

'Segoe UI',
sans-serif;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

}

.card{

width:850px;
max-width:90%;

padding:55px;

border-radius:38px;

background:

rgba(
255,
255,
255,
0.75
);

backdrop-filter:

blur(12px);

box-shadow:

0 15px 45px
rgba(
145,
168,
208,
0.25
);

text-align:center;

}

h1{

font-size:58px;

margin-bottom:10px;

background:

linear-gradient(
90deg,
#F7CAC9,
#91A8D0
);

-webkit-background-clip:text;

color:transparent;

letter-spacing:2px;

}

.subtitle{

font-size:20px;

font-style:italic;

color:#6E84A8;

margin-bottom:30px;

}

button{

border:none;

padding:

16px 35px;

border-radius:35px;

cursor:pointer;

font-size:18px;

background:

linear-gradient(
135deg,
#F7CAC9,
#91A8D0
);

color:white;

box-shadow:

0 8px 20px
rgba(
145,
168,
208,
0.25
);

transition:.3s;

margin:10px;

}

button:hover{

transform:

translateY(-2px);

}

.hidden{

display:none;

}

.cake{

position:relative;

width:330px;
height:280px;

margin:auto;

}

.layer1{

position:absolute;

bottom:0;

left:35px;

width:260px;
height:100px;

background:

#FFF7FA;

border:

5px solid
#D9C7E7;

border-radius:

0 0 30px 30px;

}

.layer2{

position:absolute;

bottom:80px;

left:55px;

width:220px;
height:75px;

background:

#FFFFFF;

border:

5px solid
#BDD2EA;

border-radius:20px;

}

.top{

position:absolute;

bottom:145px;

left:70px;

width:190px;
height:50px;

background:

linear-gradient(
90deg,
#F7CAC9,
#91A8D0
);

border-radius:50%;

}

.drip{

position:absolute;

background:#F7CAC9;

width:18px;

border-radius:

0 0 15px 15px;

}

.d1{

left:95px;

bottom:120px;

height:32px;

}

.d2{

left:150px;

bottom:110px;

height:45px;

}

.d3{

left:205px;

bottom:120px;

height:30px;

}

.candle{

position:absolute;

width:14px;
height:70px;

bottom:155px;

border-radius:6px;

}

.c1{

left:110px;

background:#F7CAC9;

}

.c2{

left:155px;

background:#91A8D0;

}

.c3{

left:200px;

background:#D9BEEB;

}

.flame{

position:absolute;

top:-28px;

left:-2px;

width:18px;
height:28px;

background:

radial-gradient(
circle,
#FFFBEA 15%,
#FFD76A 50%,
#FF9650 80%
);

border-radius:

50%;

animation:

fire .25s infinite alternate;

}

@keyframes fire{

from{

transform:

scale(1)

}

to{

transform:

scale(1.12)

rotate(-3deg)

}

}

.off .flame{

display:none;

}

#etat{

font-size:18px;

color:#6E84A8;

margin-top:20px;

}

iframe{

display:none;

}

</style>

</head>

<body>

<div class="card">

<div id="depart">

<h1>

Happy Birthday

</h1>

<p class="subtitle">

my angel

</p>

<button
onclick="commencer()">

open

</button>

</div>

<div
id="anniv"
class="hidden">

<h1>

Happy Birthday

</h1>

<p class="subtitle">

my angel

</p>

<div
id="cake"
class="cake">

<div class="candle c1">

<div class="flame"></div>

</div>

<div class="candle c2">

<div class="flame"></div>

</div>

<div class="candle c3">

<div class="flame"></div>

</div>

<div class="top"></div>

<div class="drip d1"></div>

<div class="drip d2"></div>

<div class="drip d3"></div>

<div class="layer2"></div>

<div class="layer1"></div>

</div>

<p id="etat">

allow microphone

</p>

<button
onclick="rallumer()">

light candles

</button>

</div>

<iframe
id="youtube"
allow="autoplay">
</iframe>

</div>

<script>

let stream

function commencer(){

document
.getElementById(
"depart"
)
.classList
.add(
"hidden"
)

document
.getElementById(
"anniv"
)
.classList
.remove(
"hidden"
)

document
.getElementById(
"youtube"
)
.src=

"https://www.youtube.com/embed/GZ5cOiqr5xA?autoplay=1"

micro()

}

function rallumer(){

document
.getElementById(
"cake"
)
.classList
.remove(
"off"
)

document
.getElementById(
"etat"
)
.innerHTML=

"blow"

}

async function micro(){

try{

stream=

await navigator
.mediaDevices
.getUserMedia({

audio:true

})

document
.getElementById(
"etat"
)
.innerHTML=

"blow"

const context=

new AudioContext()

const source=

context
.createMediaStreamSource(
stream
)

const analyser=

context
.createAnalyser()

source
.connect(
analyser
)

const data=

new Uint8Array(
analyser.frequencyBinCount
)

function detect(){

analyser
.getByteFrequencyData(
data
)

let volume=

data.reduce(
(a,b)=>a+b
)
/data.length

if(volume>40){

document
.getElementById(
"cake"
)
.classList
.add(
"off"
)

document
.getElementById(
"etat"
)
.innerHTML=

"candles out"

}

requestAnimationFrame(
detect
)

}

detect()

}

catch{

document
.getElementById(
"etat"
)
.innerHTML=

"microphone blocked"

}

}

</script>

</body>
</html>
