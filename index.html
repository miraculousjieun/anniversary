<script>

function commencer(){

depart
.classList
.add(
"hidden"
)

anniv
.classList
.remove(
"hidden"
)

youtube.src=

"https://www.youtube.com/embed/GZ5cOiqr5xA?autoplay=1"

micro()

}

function rallumer(){

cake
.classList
.remove(
"off"
)

etat.innerHTML=

"blow"

}

async function micro(){

try{

const stream=

await navigator
.mediaDevices
.getUserMedia({

audio:true

})

etat.innerHTML=

"blow"

const context=

new AudioContext()

const source=

context
.createMediaStreamSource(
stream
)

const analyser=

context
.createAnalyser()

source.connect(
analyser
)

const data=

new Uint8Array(
analyser.frequencyBinCount
)

function detect(){

analyser
.getByteFrequencyData(
data
)

let volume=

data.reduce(
(a,b)=>a+b
)
/data.length

if(volume>40){

cake
.classList
.add(
"off"
)

etat.innerHTML=

"candles out"

}

requestAnimationFrame(
detect
)

}

detect()

}

catch{

etat.innerHTML=

"microphone blocked"

}

}

</script>
